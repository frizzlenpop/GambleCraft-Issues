name: Bug report
description: Report a GambleCraft bug, crash, or multiplayer problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve GambleCraft. Please search existing issues before reporting a bug.
        Include enough detail to reproduce the problem. Remove private information, server addresses, and access tokens from logs before sharing them.
  - type: input
    id: mod-version
    attributes:
      label: GambleCraft version
      description: Use the complete version or JAR filename from your mods folder.
      placeholder: gamblecraft-forge-1.20.1-1.1.0.jar
    validations:
      required: true
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: "1.20.1, 1.21.1, or 26.3"
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Mod loader
      options:
        - Forge
        - NeoForge
    validations:
      required: true
  - type: input
    id: loader-version
    attributes:
      label: Mod loader version
      placeholder: "47.4.28, 52.1.20, or 26.3.0.92"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where does the problem happen?
      options:
        - Singleplayer
        - Multiplayer - dedicated server
        - Multiplayer - LAN or hosted world
        - Multiple environments
        - Other or unsure
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: What happened?
      description: Describe the bug and any visible error message.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the items, station actions, commands, or settings involved. Say if it happens every time or only occasionally.
      placeholder: |
        1. Start a world with...
        2. Place an Upgrade Station and...
        3. The problem occurs when...
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Mods, configuration, and creator setup
      description: List other mods or your modpack, changed GambleCraft settings or data packs, and relevant client/server differences. For recording or streaming issues, describe the recording setup and whether the player or spectator sees the problem.
  - type: textarea
    id: logs
    attributes:
      label: Logs and crash reports
      description: Attach the relevant latest.log or crash report, or link to a paste. For roll or reward problems, include the relevant lines from logs/gamblecraft-rolls.log. Remove private information first.
  - type: textarea
    id: media
    attributes:
      label: Screenshots, clips, or other context
      description: Add a screenshot or a short clip if it helps show the problem.
